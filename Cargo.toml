[package]
name = "mdbook-wikijs"
version = "0.1.0"
edition = "2021"
authors = ["aRustyDev"]
description = "MDBook backend that outputs Wiki.js-compatible markdown with schema validation"
license = "MIT"
repository = "https://github.com/aRustyDev/mdbook-wikijs"
keywords = ["mdbook", "wiki.js", "markdown", "documentation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
mdbook = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
jsonschema = "0.18"
pulldown-cmark = "0.10"
regex = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
pretty_assertions = "1.0"
tempfile = "3.0"
